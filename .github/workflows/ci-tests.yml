name: CI Tests

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          CI: "true"
          FORCE_COLOR: 3
          NODE_OPTIONS: "--no-warnings"
        run: npm test

      - name: Lint
        run: npm run lint
