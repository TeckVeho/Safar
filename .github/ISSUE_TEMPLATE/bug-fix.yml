name: Bug fix (AIDD)
description: Defect fix — lightweight Issue; OpenSpec/docs/tests when behavior changes
title: "[Bug] "
labels:
  - bug
  - aidd
body:
  - type: markdown
    attributes:
      value: |
        ## AIDD workflow

        Per [`docs/architecture/development-flow.md`](docs/architecture/development-flow.md) §8 and §9:

        - **Issue** is always the unit of work
        - **OpenSpec** — only if behavior or design decisions change
        - **Docs** — update if external specs or operations are affected
        - **Tests** — add/update for reproducible bugs; optional for typo/docs-only

        ---

        ## Create with Cursor Agent

        Attach `@docs/architecture/development-flow.md` (§8) and relevant spec files, then:

        ```
        Draft a bug-fix GitHub issue for: <symptom>.
        Include reproduction steps, expected vs actual, environment, and acceptance criteria.
        Say whether OpenSpec/docs/tests are required per Work Type Matrix.
        ```

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (production down / data loss)
        - High (major feature broken)
        - Medium (workaround exists)
        - Low (minor / cosmetic)
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-line description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, role, env (dev/stg/prod), build/version
      value: |
        - Environment:
        - User role:
        - Version / commit:
    validations:
      required: false

  - type: textarea
    id: root-cause
    attributes:
      label: Root cause (if known)
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria / verification
      value: |
        - [ ] Bug no longer reproducible with steps above
        - [ ] Regression test added (if applicable)
    validations:
      required: true

  - type: checkboxes
    id: deliverables
    attributes:
      label: Deliverables (check what applies)
      options:
        - label: OpenSpec update needed (behavior change)
        - label: Docs update needed (docs/specifications or apispec)
        - label: Unit / integration test added or updated
        - label: Branch fix/{issue-number}-{short-title}

  - type: textarea
    id: related-ids
    attributes:
      label: Related FR / SCR / APIs
    validations:
      required: false
